version: '3.8'

services:
  backend:
    build:
      context: ./backend
    ports:
      - '5000:5000'
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/leasify
      - NODE_ENV=production
      - JWT_SECRET=your_super_secret_jwt_access_token_secret_key_12345
      - JWT_REFRESH_SECRET=your_super_secret_jwt_refresh_token_secret_key_54321
      - JWT_EXPIRE=15m
      - JWT_REFRESH_EXPIRE=7d
      - FRONTEND_URL=http://localhost
    depends_on:
      - mongo

  frontend:
    build:
      context: ./frontend
    ports:
      - '80:80'
    depends_on:
      - backend

  mongo:
    image: mongo:latest
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
